version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: sopro_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sopro_db
      MYSQL_USER: sopro_user
      MYSQL_PASSWORD: sopro_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/sopro_db.sql:/docker-entrypoint-initdb.d/sopro_db.sql
    command: --default-authentication-plugin=mysql_native_password

  php:
    build: .
    container_name: sopro_php
    depends_on:
      - db
    volumes:
      - ./:/var/www/html
    ports:
      - "8080:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: always

volumes:
  db_data:
