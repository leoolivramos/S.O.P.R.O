name: Deploy S.O.P.R.O (diretório do usuário)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Sincronizar arquivos com o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: "/home/calvos/Leonardo/SCP_Foundation"

      - name: Ajustar permissões, importar banco e iniciar servidor
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            chmod -R 775 /home/calvos/Leonardo/SCP_Foundation/uploads
            mysql -u${{ secrets.DB_USER }} -p${{ secrets.DB_PASS }} < /home/calvos/Leonardo/SCP_Foundation/sql/sopro_db.sql
            php -S 0.0.0.0:8888 -t /home/calvos/SCP_Foundation > /home/calvos/Leonardo/SCP_Foundation/server.log 2>&1 &